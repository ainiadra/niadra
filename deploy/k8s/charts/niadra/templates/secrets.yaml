{{- if eq .Values.part "base" }}
{{- /*
Secrets come from the provider's secret store through External Secrets; nothing secret is in this
repository. Each Secret carries only what its readers need: the processes that answer the data API
never get the schema owner's password (setup, the loops' provisioner, the backups, PgBouncer's userlist
and the control plane do), and the database master password only reaches the one-shot init job.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: niadra
  labels: {{- include "niadra.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
{{- $store := dict "kind" "ClusterSecretStore" "name" "niadra" }}
{{- $app := .Values.secretStore.app }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: niadra-cell
  labels: {{- include "niadra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: niadra-cell
    template:
      data:
        NIADRA_DB_APP_PASSWORD: "{{ `{{ .db_app_password }}` }}"
        NIADRA_DB_SYSTEM_PASSWORD: "{{ `{{ .db_system_password }}` }}"
        NIADRA_KEY_PEPPER: "{{ `{{ .key_pepper }}` }}"
        NIADRA_SUBJECT_TOKEN_SECRET: "{{ `{{ .subject_token_secret }}` }}"
        NIADRA_CELL_TOKEN: "{{ `{{ .cell_token }}` }}"
        NIADRA_LLM_API_KEY: "{{ `{{ .llm_api_key }}` }}"
        NIADRA_LLM_BASE_URL: "{{ `{{ .llm_base_url }}` }}"
        NIADRA_LLM_MODEL: "{{ `{{ .llm_model }}` }}"
        NIADRA_DECISIONS_BASE_URL: "{{ `{{ .decisions_base_url }}` }}"
        NIADRA_DECISIONS_MODEL: "{{ `{{ .decisions_model }}` }}"
        # Full name: KEDA reads this URL from its own namespace to scale the worker pools.
        NIADRA_RABBITMQ_URL: "amqp://niadra:{{ `{{ .rabbitmq_password }}` }}@niadra-rabbitmq.{{ .Release.Namespace }}.svc:5672"
  data:
    {{- range list "db_app_password" "db_system_password" "key_pepper" "subject_token_secret" "cell_token" "rabbitmq_password" }}
    - secretKey: {{ . }}
      remoteRef: {key: {{ $app }}, property: {{ . }}}
    {{- end }}
    {{- range $key, $property := dict "llm_api_key" "api_key" "llm_base_url" "base_url" "llm_model" "model" "decisions_base_url" "decisions_base_url" "decisions_model" "decisions_model" }}
    - secretKey: {{ $key }}
      remoteRef: {key: {{ $.Values.secretStore.llm }}, property: {{ $property }}}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: niadra-owner
  labels: {{- include "niadra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: niadra-owner
    template:
      data:
        NIADRA_DB_OWNER_PASSWORD: "{{ `{{ .db_owner_password }}` }}"
  data:
    - secretKey: db_owner_password
      remoteRef: {key: {{ $app }}, property: db_owner_password}
{{- if not .Values.controlPlane.url }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: niadra-control
  labels: {{- include "niadra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: niadra-control
    template:
      data:
        NIADRA_KEY_PEPPER: "{{ `{{ .key_pepper }}` }}"
        NIADRA_CELL_TOKEN: "{{ `{{ .cell_token }}` }}"
        NIADRA_CONTROL_OPERATOR_TOKEN: "{{ `{{ .operator_token }}` }}"
        NIADRA_CONTROL_SECRETS_KEY: "{{ `{{ .control_secrets_key }}` }}"
        signing.pem: "{{ `{{ .control_signing_key }}` }}"
  data:
    {{- range list "key_pepper" "cell_token" "operator_token" "control_signing_key" "control_secrets_key" }}
    - secretKey: {{ . }}
      remoteRef: {key: {{ $app }}, property: {{ . }}}
    {{- end }}
{{- end }}
---
# The broker's default user: the operator reads username, password and default_user.conf from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: niadra-rabbitmq-user
  labels: {{- include "niadra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: niadra-rabbitmq-user
    template:
      data:
        username: niadra
        password: "{{ `{{ .rabbitmq_password }}` }}"
        default_user.conf: |
          default_user = niadra
          default_pass = {{ `{{ .rabbitmq_password }}` }}
  data:
    - secretKey: rabbitmq_password
      remoteRef: {key: {{ $app }}, property: rabbitmq_password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: niadra-db-init
  labels: {{- include "niadra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: niadra-db-init
    template:
      data:
        PGUSER: "{{ `{{ .master_username }}` }}"
        PGPASSWORD: "{{ `{{ .master_password }}` }}"
        OWNER_PASSWORD: "{{ `{{ .db_owner_password }}` }}"
        APP_PASSWORD: "{{ `{{ .db_app_password }}` }}"
        SYSTEM_PASSWORD: "{{ `{{ .db_system_password }}` }}"
        SITE_PASSWORD: "{{ `{{ .db_site_password }}` }}"
  data:
    - secretKey: master_username
      remoteRef: {key: {{ required "database.masterSecret is set at deploy" .Values.database.masterSecret }}, property: username}
    - secretKey: master_password
      remoteRef: {key: {{ .Values.database.masterSecret }}, property: password}
    {{- range list "db_owner_password" "db_app_password" "db_system_password" "db_site_password" }}
    - secretKey: {{ . }}
      remoteRef: {key: {{ $app }}, property: {{ . }}}
    {{- end }}
{{- if not .Values.controlPlane.url }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: niadra-site-api
  labels: {{- include "niadra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: niadra-site-api
    template:
      data:
        # node-postgres reads `require` as full verification; `no-verify` keeps TLS without the CA bundle.
        DATABASE_URL: "postgres://niadra_site:{{ `{{ .db_site_password }}` }}@{{ .Values.database.host }}:5432/niadra_site?sslmode=no-verify"
  data:
    - secretKey: db_site_password
      remoteRef: {key: {{ $app }}, property: db_site_password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: niadra-site-admin
  labels: {{- include "niadra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: niadra-site-admin
    template:
      data:
        ADMIN_EMAIL: "{{ `{{ .email }}` }}"
        ADMIN_PASSWORD_HASH: "{{ `{{ .password_hash }}` }}"
  data:
    {{- range list "email" "password_hash" }}
    - secretKey: {{ . }}
      remoteRef: {key: {{ $.Values.secretStore.siteAdmin }}, property: {{ . }}}
    {{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels: {{- include "niadra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ `{{ .grafana_admin_password }}` }}"
  data:
    - secretKey: grafana_admin_password
      remoteRef: {key: {{ $app }}, property: grafana_admin_password}
{{- end }}
