[project]
name = "niadra-server"
version = "0.1.0"
description = "Niadra: the omnichannel memory layer for a company's AI agents."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "uvloop>=0.21",
  "pydantic>=2.9",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.2",
  "aio-pika>=9.4",
  "aiobotocore>=2.15",
  "httpx>=0.28",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "jmespath>=1.0",
  "orjson>=3.10",
  "pyarrow>=18",
  "prometheus-client>=0.21",
  "signxml>=4.0",
  "pypdf>=6.19.0",
  "zstandard>=0.23",
  "opentelemetry-proto>=1.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "fakeredis[lua]>=2.26",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-jmespath",
  "types-protobuf>=7.35.1.20260906",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niadra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs a real PostgreSQL (NIADRA_TEST_DSN)",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "RET", "ARG"]
# N818: the error classes are the API vocabulary (`NotFound`, `Conflict`), not `...Error` names.
ignore = ["S101", "RUF001", "RUF002", "RUF003", "S608", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "ARG", "N802"]
# The delay tests import the fixtures of the unit tests they run again on PostgreSQL, by name.
"tests/integration/delays/**" = ["F401", "F811"]
# Revisions carry SQL function bodies verbatim; wrapping them would hurt more than it helps.
"migrations/**" = ["E501"]
# Fakes implement the ports keyword for keyword, including arguments they have no use for.
"src/niadra/adapters/memory/fakes.py" = ["ARG002"]
# The grants block is kept line for line identical to the chart's db-init.sql.
"src/niadra/adapters/outbound/postgres/provisioning.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["niadra"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["niadra.adapters.*", "niadra.entrypoints.*"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["jmespath.*", "fakeredis.*", "aiobotocore.*", "pyarrow.*", "lxml.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "niadra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entrypoints > adapters > app > ports > domain"
type = "layers"
layers = [
  "niadra.entrypoints",
  "niadra.adapters",
  "niadra.app",
  "niadra.ports",
  "niadra.config",
  "niadra.contracts",
  "niadra.domain",
]

[[tool.importlinter.contracts]]
name = "The domain is pure: no I/O libraries"
type = "forbidden"
source_modules = ["niadra.domain"]
forbidden_modules = ["sqlalchemy", "psycopg", "redis", "aio_pika", "aiobotocore", "httpx", "fastapi", "uvicorn"]
