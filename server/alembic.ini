# Three independent histories: `alembic --name control|cell|space upgrade head`.
#   control  the control plane's database
#   cell     the cell database (niadra_cell): directory, keys, configuration copy
#   space    every space database (s_<space id hex>); `serve setup` applies it to the whole fleet
# From the command line the URL comes from NIADRA_CONTROL_DATABASE_URL, NIADRA_CELL_DATABASE_URL
# (or NIADRA_DATABASE_URL) and NIADRA_SPACE_DATABASE_URL.

[cell]
script_location = %(here)s/migrations/cell
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[space]
script_location = %(here)s/migrations/space
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[control]
script_location = %(here)s/migrations/control
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
