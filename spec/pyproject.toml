[project]
name = "niadra-spec"
version = "0.1.0"
description = "Open specifications of Niadra: the event envelope, the context pack and the verification assertion."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "cryptography>=43",
  "jsonschema[format-nongpl]>=4.23",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "RET"]
